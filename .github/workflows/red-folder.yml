name: Red folder calendar

# Pulls the US high impact events (CPI, NFP, FOMC and the rest of the red
# folder) into data/red-folder.json, which the page reads. Commits only when
# the events change, so the site rebuilds only when there is news.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/red-folder.yml"
      - ".github/scripts/red_folder.py"

permissions:
  contents: write

concurrency:
  group: red-folder
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh the calendar
        run: python3 .github/scripts/red_folder.py
      - name: Commit if it changed
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -q -m "Red folder calendar: refresh"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          fi
