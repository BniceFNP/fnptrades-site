<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrintSquad has moved to printsquad.net</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://printsquad.net/">
<script>
(function () {
  // old one page anchors -> their own pages on printsquad.net
  var ANCHORS = { "#join": "/join/", "#tools": "/tools/", "#learn": "/learn/", "#scanner": "/members/",
                  "#one-on-one": "/book/", "#ai-team": "/aiclass/", "#mentorship": "/learn/mentorship/" };
  var p = location.pathname, h = location.hash;
  if ((p === "/" || p === "/index.html") && ANCHORS[h]) { p = ANCHORS[h]; h = ""; }
  location.replace("https://printsquad.net" + p + location.search + h);
})();
</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07090B;color:rgba(255,255,255,.7);
       font:300 17px/1.6 "Hanken Grotesk",system-ui,sans-serif;text-align:center;padding:24px}
  a{color:#2FE3F6}
  h1{font:300 30px/1.2 "Sora",system-ui,sans-serif;color:#fff;margin:0 0 10px}
</style>
</head>
<body>
<main>
  <h1>PrintSquad has moved.</h1>
  <p>Find us at <a href="https://printsquad.net/">printsquad.net</a></p>
  <noscript><meta http-equiv="refresh" content="0; url=https://printsquad.net/"></noscript>
</main>
</body>
</html>
